:root{--pine:#123a2b;--pine2:#0b281e;--red:#a5182d;--red2:#761020;--gold:#d9b15f;--cream:#fff7e7;--ink:#402b26;--muted:#75645e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:radial-gradient(circle at 15% 7%,rgba(255,255,255,.8) 0 1.5px,transparent 2px),radial-gradient(circle at 78% 15%,rgba(255,255,255,.7) 0 1.5px,transparent 2px),linear-gradient(155deg,#194934,var(--pine2) 52%,#68182a);background-size:50px 50px,74px 74px,auto;padding:18px 12px 35px}.wrap{max-width:560px;margin:auto}.hero{text-align:center;color:#fff;padding:10px 8px 18px}.tree{font-size:42px;filter:drop-shadow(0 3px 4px #0005)}.hero h1{font-size:29px;line-height:1.1;margin:5px 0}.hero .sub{color:#f7dfb1;margin:8px 0 0;font-size:16px}.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,250,239,.99),rgba(255,244,222,.98));border:2px solid var(--gold);border-radius:26px;padding:22px 17px;box-shadow:0 18px 45px #0007;text-align:center}.garland{font-size:18px;letter-spacing:7px;color:var(--gold);margin:-4px 0 9px}.date{font:700 12px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--pine)}.day{font-size:41px;color:var(--red);font-weight:bold;margin:7px 0}.message{font-size:18px;line-height:1.55;margin:12px auto 19px;max-width:455px}.video{width:100%;aspect-ratio:16/9;border-radius:17px;background:#111;display:none;box-shadow:0 8px 20px #0003}.video.show{display:block}.btn{width:100%;border:1px solid #e8c476;border-radius:999px;padding:15px;font-size:16px;font-weight:bold;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;cursor:pointer;box-shadow:0 7px 16px #76102044}.btn:disabled{background:#978c84;border-color:#aaa;cursor:not-allowed;box-shadow:none}.status{font:13px Arial,sans-serif;color:var(--muted);margin:11px 0 3px}.family-note{margin:16px 0 4px;color:var(--pine);font-size:14px}.doors{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.door{position:relative;aspect-ratio:1;border:1px solid #dabe86;border-radius:13px;background:linear-gradient(145deg,#fffdf6,#f1dfbd);color:#5b352f;font-weight:bold;cursor:pointer;box-shadow:inset 0 0 0 1px #fff9,0 3px 6px #0001}.door .num{display:block;font-size:15px}.door .mini{display:block;color:#b78b38;font-size:9px;margin-top:2px}.door.active{background:linear-gradient(145deg,#245c43,#123a2b);color:#fff;border-color:#d9b15f;transform:translateY(-1px)}.door.active .mini{color:#f5d992}.door.locked{background:#d9d3c9;color:#90867e;border-color:#c9c0b5}.door.locked .mini{color:#aaa}.footer{text-align:center;color:#f3ddbd;font-size:13px;line-height:1.45;margin-top:16px}.heart{color:#ca2941}.spark{color:#eccd86}.btn:focus-visible,.door:focus-visible{outline:3px solid #ffe399;outline-offset:3px}@media(max-width:420px){.doors{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:25px}.day{font-size:35px}.message{font-size:16.5px}}
</style></head><body><main class="wrap"><header class="hero"><div class="tree">🎄</div><h1>Mamas Familien-<br>Weihnachtskalender</h1><p class="sub">24 kleine Momente von uns für dich <span class="heart">♥</span></p></header><section class="card" aria-live="polite"><div class="garland">★ ✦ ★ ✦ ★</div><div class="date" id="dateLabel"></div><div class="day" id="dayLabel"></div><p class="message" id="message"></p><video id="videoPlayer" class="video" controls playsinline preload="metadata"></video><button type="button" class="btn" id="videoBtn">▶ Familienbotschaft öffnen</button><div class="status" id="status"></div><div class="family-note">Von deiner Familie, mit ganz viel Liebe <span class="heart">♥</span></div><nav class="doors" aria-label="Türchen wählen"><button type="button" class="door" data-day="1" aria-label="Türchen 1"><span class="num">1</span><span class="mini">★</span></button>

<button type="button" class="door" data-day="24" aria-label="Türchen 24"><span class="num">24</span><span class="mini">★</span></button></nav></section><div class="footer"><span class="spark">★</span> Weihnachten ist am schönsten, wenn wir es miteinander teilen. <span class="spark">★</span></div></main><script>(()=>{const CALENDAR_YEAR=2026;const TEST_UNLOCK_DAY=0;const CALENDAR={    1: { date: '1. Dezember', title: 'Türchen 1', message: 'Heute beginnt unser Familien-Adventskalender. Eine kleine Botschaft von uns für dich, Mama. ❤️', videoUrl: 'VIDEO_URL_1', externalUrl: '' },
    2: { date: '2. Dezember', title: 'Türchen 2', message: 'Ein kleiner Weihnachtsgruß von deiner Familie wartet heute auf dich.', videoUrl: 'VIDEO_URL_2', externalUrl: '' },
    3: { date: '3. Dezember', title: 'Türchen 3', message: 'Heute schenken wir dir ein paar Minuten nur für dich und eine Botschaft von Herzen.', videoUrl: 'VIDEO_URL_3', externalUrl: '' },
    4: { date: '4. Dezember', title: 'Türchen 4', message: 'Was Weihnachten besonders macht? Für uns ganz klar: dass wir es miteinander teilen.', videoUrl: 'VIDEO_URL_4', externalUrl: '' },
    5: { date: '5. Dezember', title: 'Türchen 5', message: 'Heute wartet eine kleine Erinnerung daran, wie wichtig du für unsere Familie bist.', videoUrl: 'VIDEO_URL_5', externalUrl: '' },
    6: { date: '6. Dezember', title: 'Türchen 6', message: 'Nikolaus! Heute steckt hinter dem Türchen natürlich eine ganz besondere Familienbotschaft.', videoUrl: 'VIDEO_URL_6', externalUrl: '' },
    7: { date: '7. Dezember', title: 'Türchen 7', message: 'Ein neuer Dezembertag und wieder ein kleiner Gruß von uns für dich.', videoUrl: 'VIDEO_URL_7', externalUrl: '' },
    8: { date: '8. Dezember', title: 'Türchen 8', message: 'Heute sagen wir einfach einmal Danke. Für all die großen und kleinen Dinge.', videoUrl: 'VIDEO_URL_8', externalUrl: '' },
    9: { date: '9. Dezember', title: 'Türchen 9', message: 'Ein kleines Stück Weihnachtsfreude von der ganzen Familie.', videoUrl: 'VIDEO_URL_9', externalUrl: '' },
    10: { date: '10. Dezember', title: 'Türchen 10', message: 'Heute wartet wieder eine persönliche Videobotschaft auf dich.', videoUrl: 'VIDEO_URL_10', externalUrl: '' },
    11: { date: '11. Dezember', title: 'Türchen 11', message: 'Noch ein bisschen näher an Weihnachten und Zeit für einen lieben Gruß von uns.', videoUrl: 'VIDEO_URL_11', externalUrl: '' },
    12: { date: '12. Dezember', title: 'Türchen 12', message: 'Halbzeit ist fast geschafft. Heute gibt es wieder etwas von Herzen.', videoUrl: 'VIDEO_URL_12', externalUrl: '' },
    13: { date: '13. Dezember', title: 'Türchen 13', message: 'Weihnachten bedeutet Familie. Und genau darum geht es heute.', videoUrl: 'VIDEO_URL_13', externalUrl: '' },
    14: { date: '14. Dezember', title: 'Türchen 14', message: 'Ein kleines Dankeschön für all das, was du das ganze Jahr für uns machst.', videoUrl: 'VIDEO_URL_14', externalUrl: '' },
    15: { date: '15. Dezember', title: 'Türchen 15', message: 'Heute schicken wir dir eine Portion Familienliebe direkt aufs Handy.', videoUrl: 'VIDEO_URL_15', externalUrl: '' },
    16: { date: '16. Dezember', title: 'Türchen 16', message: 'Nur noch wenige Tage bis Weihnachten. Hinter diesem Türchen wartet wieder eine Überraschung.', videoUrl: 'VIDEO_URL_16', externalUrl: '' },
    17: { date: '17. Dezember', title: 'Türchen 17', message: 'Heute nehmen wir uns einen Moment, um dir einfach etwas Schönes zu sagen.', videoUrl: 'VIDEO_URL_17', externalUrl: '' },
    18: { date: '18. Dezember', title: 'Türchen 18', message: 'Ein weiterer kleiner Weihnachtsmoment nur für dich, Mama.', videoUrl: 'VIDEO_URL_18', externalUrl: '' },
    19: { date: '19. Dezember', title: 'Türchen 19', message: 'Langsam wird es richtig weihnachtlich. Heute wartet wieder ein Familiengruß auf dich.', videoUrl: 'VIDEO_URL_19', externalUrl: '' },
    20: { date: '20. Dezember', title: 'Türchen 20', message: 'Noch vier Tage bis Heiligabend. Zeit für eine kleine Botschaft von Herzen.', videoUrl: 'VIDEO_URL_20', externalUrl: '' },
    21: { date: '21. Dezember', title: 'Türchen 21', message: 'Heute gibt es einen besonders warmen Weihnachtsgruß von uns allen.', videoUrl: 'VIDEO_URL_21', externalUrl: '' },
    22: { date: '22. Dezember', title: 'Türchen 22', message: 'Nur noch zweimal schlafen. Hinter diesem Türchen wartet etwas Persönliches auf dich.', videoUrl: 'VIDEO_URL_22', externalUrl: '' },
    23: { date: '23. Dezember', title: 'Türchen 23', message: 'Morgen ist Heiligabend. Heute möchten wir dir noch einmal sagen, wie froh wir sind, dich zu haben.', videoUrl: 'VIDEO_URL_23', externalUrl: '' },
    24: { date: '24. Dezember', title: 'Türchen 24', message: 'Heiligabend! Dieses letzte Türchen kommt von Herzen. Frohe Weihnachten, Mama. Wir haben dich lieb! ❤️', videoUrl: 'VIDEO_URL_24', externalUrl: '' }};const $=s=>document.querySelector(s),video=$('#videoPlayer');let currentDay=1;function unlocked(day){if(TEST_UNLOCK_DAY)return day<=TEST_UNLOCK_DAY;const n=new Date();if(n.getFullYear()>CALENDAR_YEAR)return true;if(n.getFullYear()<CALENDAR_YEAR)return false;const m=n.getMonth()+1;if(m<12)return false;return day<=n.getDate()}function render(day){currentDay=day;const d=CALENDAR[day],open=unlocked(day);$('#dateLabel').textContent=d.date;$('#dayLabel').textContent=d.title;video.pause();video.removeAttribute('src');video.load();video.classList.remove('show');if(open){$('#message').textContent=d.message;$('#videoBtn').disabled=false;$('#videoBtn').textContent='▶ Familienbotschaft öffnen';$('#status').textContent='Dieses Türchen ist für dich geöffnet. ♥'}else{$('#message').textContent='Pssst … dieses Familien-Türchen wartet noch bis zum '+day+'. Dezember auf dich. 🎅';$('#videoBtn').disabled=true;$('#videoBtn').textContent='🔒 Noch ein bisschen Geduld';$('#status').textContent='Am '+day+'. Dezember darfst du wiederkommen.'}document.querySelectorAll('.door').forEach(b=>{const x=Number(b.dataset.day);b.classList.toggle('active',x===day);b.classList.toggle('locked',!unlocked(x));b.title=unlocked(x)?'Türchen '+x:'Öffnet am '+x+'. Dezember'})}$('#videoBtn').addEventListener('click',()=>{const d=CALENDAR[currentDay];if(!unlocked(currentDay))return;if(d.videoUrl&&!d.videoUrl.startsWith('VIDEO_URL_')){video.src=d.videoUrl;video.classList.add('show');video.play().catch(()=>{});$('#status').textContent='Eure Familienbotschaft ist bereit. ♥'}else if(d.externalUrl){location.href=d.externalUrl}else $('#status').textContent='Für dieses Türchen fehlt noch der Video-Link. Trage ihn im Bereich CALENDAR ein.'});document.querySelectorAll('.door').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.day))));const q=new URLSearchParams(location.search);let requested=parseInt(q.get('tag')||'1',10);if(!Number.isInteger(requested)||requested<1||requested>24)requested=1;render(requested)})();</script></body></html>
